name: HarmonyOS device tests

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonyos-device-tests
  cancel-in-progress: false

jobs:
  device:
    name: HarmonyOS instrumented tests
    if: vars.HARMONY_CI_ENABLED == 'true'
    runs-on: [self-hosted, macos, harmonyos-api12, harmonyos-device]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run instrumented tests
        env:
          HARMONY_CLI_HOME: ${{ vars.HARMONY_CLI_HOME }}
          DEVECO_SDK_HOME: ${{ vars.DEVECO_SDK_HOME }}
        run: scripts/harmony-ci.sh device

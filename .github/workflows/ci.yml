name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base — a PR stacked on another branch
  # needs the same gate as one targeting main.
  pull_request:

# A new push to a PR cancels the run still in flight; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      integration: ${{ steps.scope.outputs.integration }}
      ios: ${{ steps.scope.outputs.ios }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both PR and push comparisons need the base commit.
          fetch-depth: 0

      - name: Reject tracked HarmonyOS signing material
        run: scripts/check-harmony-signing-profile.sh

      - name: Test HarmonyOS signing guard
        run: node --test .github/scripts/check-harmony-signing-profile.test.mjs

      - name: Test change-scope routing
        run: node --test .github/scripts/ci-change-scope.test.mjs

      - name: Resolve changed paths
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi

          git diff --name-only "$base_sha" "$GITHUB_SHA" \
            | node .github/scripts/ci-change-scope.mjs \
            | tee -a "$GITHUB_OUTPUT"

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  verify:
    name: Lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Postgres and Redis integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: linonward
          POSTGRES_USER: linonward
          POSTGRES_PASSWORD: linonward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linonward -d linonward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://linonward:linonward@127.0.0.1:5432/linonward
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations and verify infrastructure adapters
        run: pnpm --filter @linonward/api test:integration

  ios:
    name: iOS build and test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        run: pnpm ios:generate

      - name: Check generated project is current
        run: git diff --exit-code -- apps/ios/LinOnward.xcodeproj

      - name: Build
        run: pnpm ios:build

      - name: Test
        run: pnpm ios:test

  e2e:
    name: End-to-end
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @linonward/www exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on the version so a Playwright bump re-downloads rather than
      # running new code against last release's browser.
      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @linonward/www exec playwright install --with-deps chromium

      # A cache hit restores the browser but not the system libraries it links
      # against, which live outside the cached path.
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @linonward/www exec playwright install-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/www/playwright-report/
          retention-days: 7

name: Feishu task

# Headless Claude, driven by a Feishu message. The relay (see docs) turns a
# Feishu event into this dispatch; nothing here talks to Feishu inbound.
#
# `repository_dispatch` only ever reads the workflow file from the default
# branch, so edits to this file do nothing until they land on main.
on:
  repository_dispatch:
    types: [feishu-task]

# One task per conversation, queued rather than cancelled: each message is its
# own request, so cancelling loses work instead of superseding it.
concurrency:
  group: feishu-${{ github.event.client_payload.thread_key || github.event.client_payload.message_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also runs `prepare`, so husky is present and commitlint applies to the
      # commits Claude makes here.
      - name: Install
        run: pnpm install --frozen-lockfile

      # A Feishu topic maps to one deterministic Claude session. Cache entries are
      # immutable, so every run saves under its own run ID; restore-keys gets the
      # most recent transcript for that topic on the next message.
      - name: Restore Feishu topic session
        id: restore-session
        uses: actions/cache/restore@v6
        with:
          path: ~/.claude
          key: feishu-session-${{ github.event.client_payload.thread_key || github.event.client_payload.message_id }}-${{ github.run_id }}
          restore-keys: |
            feishu-session-${{ github.event.client_payload.thread_key || github.event.client_payload.message_id }}-

      - name: Decide Claude session mode
        id: session-mode
        env:
          SESSION_UUID: ${{ github.event.client_payload.session_uuid }}
        run: |
          set -euo pipefail
          if [ -z "${SESSION_UUID:-}" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=" >> "$GITHUB_OUTPUT"
          elif compgen -G "$HOME/.claude/projects/*/${SESSION_UUID}.jsonl" > /dev/null; then
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--resume ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--session-id ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
          fi

      # Static agent policy stays reviewable in .github/prompts. User text enters
      # through an environment variable and quoted printf, never shell source.
      # The random output delimiter prevents task text from injecting a workflow
      # output value by imitating the closing marker.
      - name: Build feishu-niuma prompt
        id: build-prompt
        env:
          FEISHU_TASK: ${{ github.event.client_payload.text }}
          SESSION_MODE: ${{ steps.session-mode.outputs.mode }}
        run: |
          set -euo pipefail
          delimiter="PROMPT_$(uuidgen)"
          {
            printf 'value<<%s\n' "$delimiter"
            cat .github/prompts/feishu-niuma.md
            if [ "$SESSION_MODE" = "resume" ]; then
              printf '\n这是同一飞书话题的延续，已恢复已有会话。不要重新自我介绍或复述上次结论，直接接着处理新消息。\n'
            else
              printf '\n这是本话题的首次会话；同一话题的后续消息会自动接续本次上下文。\n'
            fi
            printf '\n<task>\n%s\n</task>\n' "$FEISHU_TASK"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Run feishu-niuma
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5
            --dangerously-skip-permissions
            --max-turns 60
            ${{ steps.session-mode.outputs.claude_session_arg }}
          prompt: ${{ steps.build-prompt.outputs.value }}

      - name: Save Feishu topic session
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.claude
          key: feishu-session-${{ github.event.client_payload.thread_key || github.event.client_payload.message_id }}-${{ github.run_id }}

      # A separate step on purpose: the Feishu credentials must not exist in the
      # environment of the step above, where a successful prompt injection could
      # read them. `always()` so a failed task still gets an answer in Feishu
      # instead of silence.
      - name: Reply on Feishu
        if: always()
        env:
          LARKSUITE_CLI_APP_ID: ${{ secrets.LARKSUITE_CLI_APP_ID }}
          LARKSUITE_CLI_APP_SECRET: ${{ secrets.LARKSUITE_CLI_APP_SECRET }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/feishu-reply.mjs

name: linonward-bot

# A single named agent for Feishu, GitHub conversations, and issue intake.
# The Feishu relay dispatches this workflow with its message and session inputs.
run-name: >-
  linonward-bot · ${{ inputs.feishu_sender_name || inputs.feishu_sender || github.actor }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for linonward-bot (combined with the base prompt template)"
        required: false
        default: "分析一下当前项目"
      feishu_message_id:
        description: "Feishu message id to reply to (empty for manual dispatches)"
        required: false
        default: ""
      feishu_sender:
        description: "Feishu sender open_id (empty for manual dispatches)"
        required: false
        default: ""
      feishu_sender_name:
        description: "Feishu sender display name (empty when unavailable)"
        required: false
        default: ""
      thread_key:
        description: "Stable Feishu topic key for session reuse (empty for manual dispatches)"
        required: false
        default: ""
      session_uuid:
        description: "Stable Claude session UUID for a Feishu topic (empty for manual dispatches)"
        required: false
        default: ""
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

# Never overlap work for one Feishu topic or GitHub issue. Queuing is intentional:
# another request must not corrupt a shared Claude session or abandon an edit mid-run.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.thread_key != '')
        && format('linonward-bot-thread-{0}', inputs.thread_key)
        || format('linonward-bot-{0}', github.event.issue.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  linonward-bot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'bot' && github.event.sender.login != 'linonward-bot[bot]' && !github.event.issue.pull_request) ||
      (github.event_name == 'issue_comment' && github.event.sender.login != 'linonward-bot[bot]' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@linonward-bot')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.sender.login != 'linonward-bot[bot]' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@linonward-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      # Checkout must precede every run step, including the failure handler that
      # sends a reply to Feishu.  It intentionally uses GITHUB_TOKEN: the App
      # token below is used only for bot-authored GitHub mutations.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The private key is the only GitHub App credential kept as a secret. The
      # client ID is intentionally a repository variable because it is public.
      - name: Validate linonward-bot App configuration
        env:
          APP_CLIENT_ID: ${{ vars.LINONWARD_BOT_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.LINONWARD_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ]; then
            echo "Missing repository variable LINONWARD_BOT_CLIENT_ID." >&2
            exit 1
          fi
          if [ -z "$APP_PRIVATE_KEY" ]; then
            echo "Missing repository secret LINONWARD_BOT_PRIVATE_KEY." >&2
            exit 1
          fi

      - name: Generate linonward-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LINONWARD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINONWARD_BOT_PRIVATE_KEY }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Feishu topic session
        if: github.event_name == 'workflow_dispatch' && inputs.thread_key != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.claude
          key: bot-session-${{ inputs.thread_key }}-${{ github.run_id }}
          restore-keys: |
            bot-session-${{ inputs.thread_key }}-

      - name: Decide Claude session mode
        id: session-mode
        env:
          SESSION_UUID: ${{ inputs.session_uuid }}
        run: |
          set -euo pipefail
          if [ -z "${SESSION_UUID:-}" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=" >> "$GITHUB_OUTPUT"
          elif compgen -G "$HOME/.claude/projects/*/${SESSION_UUID}.jsonl" > /dev/null; then
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--resume ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--session-id ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dispatch prompt
        id: build-prompt
        if: github.event_name == 'workflow_dispatch'
        env:
          SESSION_MODE: ${{ steps.session-mode.outputs.mode }}
          USER_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          delimiter="PROMPT_$(uuidgen)"
          {
            printf 'value<<%s\n' "$delimiter"
            cat .github/prompts/linonward-bot.md
            if [ "$SESSION_MODE" = "resume" ]; then
              printf '\n这是同一飞书话题的延续，已恢复已有会话。不要重新自我介绍或复述上次结论，直接接着处理新消息。\n'
            elif [ "$SESSION_MODE" = "fresh" ]; then
              printf '\n这是本话题的首次会话；同一话题的后续消息会自动接续本次上下文。\n'
            fi
            printf '\n<task>\n%s\n</task>\n' "$USER_PROMPT"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build ticket prompt
        id: build-ticket-prompt
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/prompts/linonward-bot.md
            cat .github/prompts/ticket.md
            printf '\n本次工单：REPO=%s ISSUE NUMBER=#%s\n' "$REPOSITORY" "$ISSUE_NUMBER"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1.0.171
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@linonward-bot"
          allowed_bots: "linonward-bot"
          claude_args: >-
            --dangerously-skip-permissions
            --model claude-opus-5
            ${{ steps.session-mode.outputs.claude_session_arg }}
          prompt: ${{ (github.event_name == 'workflow_dispatch' && steps.build-prompt.outputs.value) || (github.event_name == 'issues' && steps.build-ticket-prompt.outputs.value) || '' }}
          show_full_output: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issues' }}

      - name: Save Feishu topic session
        if: always() && github.event_name == 'workflow_dispatch' && inputs.thread_key != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.claude
          key: bot-session-${{ inputs.thread_key }}-${{ github.run_id }}

      - name: Report failure to issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "⚠️ 接单运行失败，本工单未完成。请查看运行日志：$RUN_URL"

      # Keep Feishu credentials out of the agent step so a prompt-injection bug
      # cannot expose them. Reply even after a failed run, using its URL as fallback.
      - name: Reply on Feishu
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          inputs.feishu_message_id != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          LARKSUITE_CLI_APP_ID: ${{ secrets.LARKSUITE_CLI_APP_ID }}
          LARKSUITE_CLI_APP_SECRET: ${{ secrets.LARKSUITE_CLI_APP_SECRET }}
          MESSAGE_ID: ${{ inputs.feishu_message_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/feishu-reply.mjs

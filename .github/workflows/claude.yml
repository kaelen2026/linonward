name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# One Claude run per issue or PR at a time. Unlike ci.yml this does not cancel
# in flight: each mention is a separate request, and killing one mid-edit loses
# the work rather than superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Cheap pre-filter so a runner does not start on unrelated chatter. The
    # action re-checks the trigger phrase itself, and rejects actors without
    # write access, so this is cost control rather than a security boundary.
    # Scoped per event on purpose: an unscoped `github.event.issue.body` check
    # would also match every later comment on an issue that happens to mention
    # @claude in its body, burning a runner each time.
    if: >
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # commit and push
      pull-requests: write # open PRs, comment
      issues: write # reply on issues
      id-token: write # the action's default GitHub App auth
      actions: read # read CI results on a PR

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the git rules have Claude reading `git log main` and
          # comparing branches, none of which works on a depth-1 clone.
          fetch-depth: 0

      # The toolchain, so Claude can actually run this repo's verification gate
      # (`pnpm lint`, `pnpm typecheck`, `pnpm build`) instead of guessing.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also runs the root `prepare` script, so husky recreates `.husky/_` and
      # commitlint and lint-staged apply to Claude's own commits.
      - name: Install
        run: pnpm install --frozen-lockfile

      # No `github_token` on purpose. Left out, the action authenticates as the
      # Claude GitHub App, and GitHub does fire workflows for an App's pushes --
      # so ci.yml runs on what Claude commits. Passing GITHUB_TOKEN here would
      # silently stop that: GitHub never triggers workflows from its own token.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

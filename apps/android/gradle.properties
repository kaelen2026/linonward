org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Each library gets its own R class, so `app`'s R does not carry every
# transitive resource id. Faster builds, and an accidental dependency on
# another module's resource fails to compile.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Where the build points the app by default, per build type. Debug uses the
# emulator's alias for the host loopback, so `pnpm --filter @linonward/api dev`
# is reachable with no configuration — the same contract as
# LINONWARD_API_BASE_URL in `apps/ios` and NEXT_PUBLIC_API_URL in the web
# workspaces. Release ships empty on purpose; see app/build.gradle.kts.
linonward.apiBaseUrl.debug=http://10.0.2.2:3001
linonward.apiBaseUrl.release=

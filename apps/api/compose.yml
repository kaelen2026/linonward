services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the network the services answer to their compose names, whatever
      # .env says for a host-side run.
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
    image: linonward-api:local
    init: true
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped
    # Migrations run in the same container as the app: one image, one command,
    # and no window where the code is newer than the schema.
    command: sh -c "node dist/migrate.js && node dist/index.js"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: linonward
      POSTGRES_USER: linonward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linonward}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linonward -d linonward"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    # Rate-limit counters are disposable, so no persistence and a hard ceiling
    # with LRU eviction rather than an unbounded dataset.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

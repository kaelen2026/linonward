name: linonward

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      # Inside the network the services answer to their Compose names, whatever
      # apps/api/.env says for a host-side run.
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
    image: linonward-api:local
    init: true
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped
    command: node dist/index.js

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
    image: linonward-api:local
    profiles: ["migrate"]
    command: node dist/migrate.js

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: linonward
      POSTGRES_USER: linonward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linonward}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linonward -d linonward"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to loopback: reachable for `pnpm dev` and the Postgres half of the
    # repository contract test, not from anywhere else on the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      # Postgres 18+ wants the mount one level up from `data`: the image stores
      # under a major-version subdirectory so `pg_upgrade --link` does not have
      # to cross a mount boundary. Mounting `/var/lib/postgresql/data`, the
      # pre-18 convention, makes the container refuse to start.
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    # Rate-limit counters are disposable, so no persistence and a hard ceiling
    # with LRU eviction rather than an unbounded dataset.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  postgres-data:
    name: linonward-postgres-data

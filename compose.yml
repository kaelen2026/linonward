name: linonward

services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./apps/worker/.env
        required: false
    environment:
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
      REDIS_URL: redis://redis:6379
    image: linonward-worker:local
    init: true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      # Inside the network the services answer to their Compose names, whatever
      # apps/api/.env says for a host-side run.
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    image: linonward-api:local
    init: true
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped
    command: node dist/index.js

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://linonward:${POSTGRES_PASSWORD:-linonward}@postgres:5432/linonward
    image: linonward-api:local
    profiles: ["migrate"]
    command: node dist/migrate.js

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: linonward
      POSTGRES_USER: linonward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linonward}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linonward -d linonward"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to loopback: reachable for `pnpm dev` and the Postgres half of the
    # repository contract test, not from anywhere else on the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      # Postgres 18+ wants the mount one level up from `data`: the image stores
      # under a major-version subdirectory so `pg_upgrade --link` does not have
      # to cross a mount boundary. Mounting `/var/lib/postgresql/data`, the
      # pre-18 convention, makes the container refuse to start.
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    # BullMQ requires noeviction so Redis never silently removes queued jobs.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-linonward}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    restart: unless-stopped
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  tempo:
    image: grafana/tempo:2.7.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  grafana-data:
    name: linonward-grafana-data
  postgres-data:
    name: linonward-postgres-data
  prometheus-data:
    name: linonward-prometheus-data
  redis-data:
    name: linonward-redis-data
  tempo-data:
    name: linonward-tempo-data

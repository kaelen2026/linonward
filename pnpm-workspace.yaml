packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  protobufjs: true

# Build scripts allowed to run on install (pnpm blocks the rest by default).
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - "esbuild"
  - "protobufjs"
  - "sharp"
  - "unrs-resolver"
